# Aviation Data Scraper Configuration

# Data source configuration
source:
  name: "acukwik"  # Source identifier used in external_id

# Input configuration
input:
  # Single CSV file or list of CSV files
  csv_paths:
    - "../data.csv"
    # - "../country_links.csv"
  
  # Expected CSV columns (flexible - will look for these names):
  # - url, link, or "Airport Link": URL to scrape (REQUIRED)
  # - entity_type: "airport" or "organization" (auto-detected if missing)
  # - airport_icao or ICAO: Associated airport code (optional)
  # - Any other columns are ignored but preserved for reference

# Output configuration
output:
  directory: "output"
  batch_size: 1  # Number of records to batch before writing

# Progress tracking
progress:
  file: "progress/scraping_progress.json"

# Scraping configuration
scraping:
  parallel_workers: 1  # Number of parallel workers (1 for sequential - RECOMMENDED for debugging)
  max_retries: 3  # Maximum retry attempts per URL
  retry_backoff: 5  # Base backoff in seconds (exponential)
  delay_between_requests: 3  # Delay in seconds between requests (increased for stability)

# Selenium configuration
selenium:
  browser: "chrome"  # chrome or firefox
  headless: true  # Run browser in headless mode
  page_load_timeout: 60  # Page load timeout in seconds (increased for slow pages)
  implicit_wait: 15  # Implicit wait in seconds
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# Authentication configuration
authentication:
  enabled: true
  cookies_file: "../cookies.json"  # Path to cookies file
  base_url: "https://www.acukwik.com"
  login_url: "https://acukwik.com/Login"
  email: "ops@aeroworld.pk"  # Your login email
  password: "Mfb+4283"  # Your login password

# Validation configuration
validation:
  strict_mode: false  # If true, reject records with validation errors
  required_fields:
    airport:
      - "name"
      - "icao"
    organization:
      - "name"

# Logging configuration
logging:
  directory: "logs"
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
