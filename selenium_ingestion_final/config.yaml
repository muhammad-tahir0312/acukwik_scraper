# AC-U-KWIK aviation data scraper configuration
source:
  name: acukwik

input:
  csv_paths:
    - ../country_links.csv

output:
  directory: output
  batch_size: 1
  records_per_file: 20000

progress:
  file: progress/scraping_progress.json

scraping:
  fetch_mode: selenium
  parallel_workers: 4
  max_retries: 3
  retry_backoff: 5
  delay_between_requests: 3
  scrape_clearance: true
  scrape_nearby: true
  keep_html_cache: false

selenium:
  browser: chrome
  headless: true
  page_load_timeout: 100
  implicit_wait: 0
  # null selects a complete user agent for the installed browser.
  user_agent: null

authentication:
  enabled: true
  cookies_file: ../cookies.json
  base_url: https://acukwik.com
  login_url: https://acukwik.com/Login
  # Loaded from ignored .env or environment variables; never commit credentials.
  email: null
  password: null

validation:
  strict_mode: false
  required_fields:
    airport: [name]
    organization: [name]

logging:
  directory: logs
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
